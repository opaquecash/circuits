name: Circuits

on:
  push:
    branches: [main]
  pull_request:

env:
  CIRCOM_VERSION: v2.1.9

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install circom ${{ env.CIRCOM_VERSION }}
        run: |
          curl -sSfL "https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-amd64" \
            -o /usr/local/bin/circom
          chmod +x /usr/local/bin/circom
          circom --version

      - name: Install deps (root + v2)
        run: |
          npm ci
          npm ci --prefix v2

      - name: Build V2
        run: |
          mkdir -p v2/build
          npm run build

      - name: Cache Powers of Tau
        uses: actions/cache@v4
        with:
          path: pot16_final.ptau
          key: ptau-pot16-hez-final

      - name: Download Powers of Tau
        run: npm run download:ptau

      # Production-vkey fixture checks + live V2 round-trip:
      # witness → fresh Groth16 setup (pot16) → prove → verify.
      - name: Test
        run: npm test
